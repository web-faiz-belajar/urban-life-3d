
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#101827">
    <title>Urban Life 3D — Bandung</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-title">URBAN LIFE 3D</div>
        <div>Bandung • Open City</div>
        <div id="loading-status">Menyiapkan kota...</div>
    </div>

    <div id="game-container"></div>

    <header id="game-header">
        <div class="brand">
            <strong>URBAN LIFE</strong>
            <span>BANDUNG DISTRICT</span>
        </div>
        <div id="game-status">MENJELAJAH</div>
    </header>

    <div id="location-label">
        <span class="location-dot"></span>
        <span id="location-name">Kawasan Braga</span>
    </div>

    <div id="minimap">
        <canvas id="minimap-canvas" width="180" height="180"></canvas>
        <span class="map-caption">PETA KOTA</span>
    </div>

    <div id="controls">
        <div id="joystick">
            <div id="stick"></div>
        </div>

        <button id="run-button" type="button">
            <span>RUN</span>
        </button>
    </div>

    <div id="look-hint">Geser layar untuk melihat sekitar</div>

    <script src="js/game.js"></script>
</body>
</html>
